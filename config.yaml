# Tshark-tools 配置文件
# 跨平台支持: Windows / Linux

# TShark 可执行文件路径 (留空则自动检测)
tshark_path: ""

# 输出目录 (留空则默认与 pcap 文件同目录下创建 output 子目录)
output_dir: ""

# 日志级别: DEBUG / INFO / WARNING / ERROR
log_level: "INFO"

# TShark 运行超时秒数 (0 表示不超时)
timeout: 0

# 分析风险等级:
#   1 - 基础分析: 概要 / 时间格式 / 会话 / IP统计 / 分包
#   2 - 进阶分析: 在等级1基础上 + SQL注入 / FTP明文 / ICMP异常 / Httpd分析
#   3 - 深度分析: 在等级2基础上 + 额外文件提取 (图片/文档/压缩包等)
risk_level: 1

# 分包大小 (MB), 超过此大小的 pcap 将按会话拆分
split_size_mb: 10

# 额外文件提取配置
file_extraction:
  # 提取的文件类型扩展名
  extensions:
    - jpg
    - jpeg
    - png
    - gif
    - bmp
    - pdf
    - zip
    - rar
    - 7z
    - exe
    - dll
  # 单文件大小限制 (MB), 超过不提取
  max_file_size_mb: 50

# SQL 注入检测规则 (正则表达式)
sql_injection_patterns:
  - "(?i)(\\bunion\\b.*\\bselect\\b)"
  - "(?i)(\\bselect\\b.*\\bfrom\\b)"
  - "(?i)(\\binsert\\b.*\\binto\\b)"
  - "(?i)(\\bdelete\\b.*\\bfrom\\b)"
  - "(?i)(\\bdrop\\b.*\\btable\\b)"
  - "(?i)(\\bupdate\\b.*\\bset\\b)"
  - "(?i)('.*(or|and)\\s+.*=.*)"
  - "(?i)(\\bexec\\b.*\\()"
  - "(?i)(--|\\/\\*|\\*\\/|#)"
  - "(?i)(\\bsleep\\s*\\()"
  - "(?i)(\\bbenchmark\\s*\\()"

# ICMP 异常检测阈值
icmp_anomaly:
  # 单个 ICMP 大包阈值 (字节)
  large_packet_bytes: 1000
  # 同源高频 ICMP 阈值 (包数)
  high_frequency_count: 100

# Httpd 分析配置
httpd_analysis:
  # 关注的 HTTP 状态码
  status_codes:
    - 200
    - 301
    - 302
    - 400
    - 401
    - 403
    - 404
    - 500
    - 502
    - 503
  # 关注的请求方法
  methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
